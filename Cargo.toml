[package]
name = "recoge"
version = "0.2.1"
authors = ["Miguel Ángel Sánchez Herreros", "Tidop Research Group <tidop@usal.es>"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.95"

[dependencies]
bollard = "0.21.0"
chrono = { version = "0.4.45", features = ["serde"] }
dark-light = "2.0.0"
eframe = { version = "0.36.2", features = [
  "default",
  "persistence", # for storage_dir
  "__screenshot", # __screenshot is so we can dump a screenshot using EFRAME_SCREENSHOT_TO
] }
egui_extras = { version = "0.36.2", features = ["default", "svg"] } # image support
env_logger = { version = "0.11.10", features = ["auto-color", "humantime"] }
log = "0.4.33"
futures-lite = "2.6.1"
futures-util = "0.3.32"
humansize = "2.1.3"
reqwest = { version = "0.13.4", features = ["json"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["serialize", "deserialize"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "time", "net", "rt-multi-thread"] }
winit = "0.30.13"
egui-notify = "0.23.0"
thiserror = "2.0.20"
serde-aux = "4.7.0"
futures = "0.3.34"
arc-swap = "1.9.2"
image = "0.25.10"
open = "5.4.4"

[profile.release]
lto = true
strip = true

[package.metadata.bundle]
name = "recoge"
identifier = "es.tidop.recoge"
icon = ["src/assets/icon.svg", "src/assets/icon.png", "src/assets/logo@2x.png"]
#resources = ["assets", "images/**/*.png", "secrets/public_key.txt"]
category = "Developer Tool"
short_description = "GEstor de REgistros de COntenedores."
#osx_frameworks = ["SDL2"]