[package]
name = "recoge"
version = "0.1.0"
authors = ["Miguel Ángel Sánchez Herreros"]
edition = "2024"
rust-version = "1.92"

[dependencies]
bollard = "0.21.0"
chrono = "0.4.45"
dark-light = "2.0.0"
eframe = { version = "0.34.3", features = [
  "default",
  "persistence", # for storage_dir
  "__screenshot", # __screenshot is so we can dump a screenshot using EFRAME_SCREENSHOT_TO
] }

# For image support:
egui_extras = { version = "0.34.3", features = ["default", "image"] }

env_logger = { version = "0.11.10", features = ["auto-color", "humantime"] }
futures-lite = "2.6.1"
futures-util = "0.3.32"
humansize = "2.1.3"
log = "0.4.33"
secrecy = { version = "0.10.3", features = ["serde"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["serialize", "deserialize"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "time", "net", "rt-multi-thread"] }
winit = "0.30.13"
egui-notify = "0.22.0"

[profile.release]
lto = true
strip = true
